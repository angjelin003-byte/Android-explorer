name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: |
          chmod +x gradlew || true
          if [ -f "AndroidProject/gradlew" ]; then chmod +x AndroidProject/gradlew || true; fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "build.gradle.kts" ] && [ -d "app" ]; then
            echo "Building from root Android project..."
            gradle assembleDebug --stacktrace
          elif [ -d "AndroidProject" ]; then
            echo "Building from AndroidProject directory..."
            cd AndroidProject
            gradle assembleDebug --stacktrace
          fi

      - name: Locate Debug APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find . -name "app-debug.apk" -o -name "*-debug.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/app-debug.apk
          else
            echo "Error: APK not found"
            exit 1
          fi

      - name: Upload app debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build-output/app-debug.apk
          if-no-files-found: error
